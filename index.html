<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CaféTech - Landing Page</title>
<link rel="stylesheet" href="style.css">
<style>
  * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
  }

  html {
      scroll-behavior: smooth;
  }

  body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
  }

  /* SECCIONES */

  section {
      min-height: 100vh;
      padding: 60px 20px;
      text-align: center;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
  }

  /* INICIO */

  #inicio {
      background-color: #e8eaf6;
  }

  #inicio h1 {
      font-size: 48px;
      color: #3949ab;
      margin-bottom: 15px;
  }

  #inicio p {
      font-size: 21px;
      color: #555;
  }

  /* SERVICIOS */

  #servicios {
      background-color: #ffffff;
  }

  #servicios h2,
  #contacto h2 {
      font-size: 36px;
      margin-bottom: 25px;
      color: #3949ab;
  }

  #servicios p {
      max-width: 700px;
      background-color: #f5f5f5;
      padding: 25px;
      border-radius: 10px;
      font-size: 18px;
      line-height: 1.6;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }

  /* CONTACTO */

  #contacto {
      background-color: #e8eaf6;
  }

  #contacto h2 {
      color: #3949ab;
  }

  #contacto p {
      font-size: 18px;
      margin: 8px 0;
  }

  #contacto b {
      color: #3949ab;
  }

  /* ADAPTACIÓN PARA CELULAR */

  @media (max-width: 600px) {

      #inicio h1 {
          font-size: 36px;
      }

      #inicio p {
          font-size: 18px;
      }

      #servicios h2,
      #contacto h2 {
          font-size: 30px;
      }

      #servicios p,
      #contacto p {
          font-size: 16px;
      }
  }
</style>
</head>
<body>

  <!-- INTEGRANTE 1: completa esta seccion de Inicio -->
  <section id="inicio">
    <h1>TODO: Nombre del negocio ficticio</h1>
    <p>TODO: Frase llamativa (eslogan)</p>
  </section>

  <!-- INTEGRANTE 2: completa esta seccion de Servicios -->
  <section id="servicios">
    <h2>Nuestros Servicios</h2>
    <p>TODO: Lista o descripción de 3 servicios/productos</p>
  </section>

  <!-- INTEGRANTE 3: completa esta seccion de Contacto -->
  <section id="contacto">
    <h2>Contáctanos</h2>
    <p>Dirección: Cra 1 #23 a 45</p>
    <p>Teléfono: 3102345678</p>
    <P>Redes: </p>
    <p><b>Instagram:</b> @Guayatienda </p>
    <p><b>TikTok:</b> @Guayatienda</p> 
    <p><b>Facebook:</b> Guayatienda</p>
  </section>

</body>
</html>
